[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# Runtime code must not depend on the build directory: solc embeds forge's
# auto-detected remappings (absolute paths) in the metadata hash, so a host
# build and a container build of the same source produced different bytecode
# and the deployment record (deployments/content-registry.31337.json) failed
# the startup identity check. Without the hash the bytecode is reproducible.
bytecode_hash = "none"

[rpc_endpoints]
mainnet = "${ETH_MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
anvil = "http://localhost:8545"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 256
depth = 32
fail_on_revert = true