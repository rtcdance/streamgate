name: Acceptance Controller Diagnostic

# Read-only post-mortem for a failed verify-docker controller. Manual dispatch
# only. Inspects the failed run's leftover containers and their logs; changes
# nothing on the runner.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI run id whose controller failed"
        required: true

permissions:
  contents: read

jobs:
  diag:
    runs-on: ${{ vars.STREAMGATE_ACCEPTANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Failed controller containers
        run: |
          RUN="${{ inputs.run_id }}"
          echo "containers for run $RUN:"
          docker ps -a --filter "name=sg-ci-$RUN" --format '{{.Names}} {{.Status}} {{.Image}}'
          for c in $(docker ps -aq --filter "name=sg-ci-$RUN"); do
            echo "== container $c"
            docker inspect --format 'image={{.Config.Image}} state={{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}} oom={{.State.OOMKilled}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' "$c" || true
            echo "-- last 60 log lines:"
            docker logs --tail 60 "$c" 2>&1 | tail -60 || true
          done
      - name: Bind-mount visibility probe (the runner _work tree)
        run: |
          W=/Users/mingo/actions-runner-streamgate/_work/streamgate/streamgate
          echo "host view of $W:"
          ls -la "$W" 2>&1 | head -8
          echo "host .git:"
          ls -d "$W/.git" 2>&1
          docker run --rm --pull never -v "$W":/probe alpine:3.20 sh -c 'echo "container view of /probe:"; ls -la /probe | head -10; echo "container .git:"; ls -d /probe/.git 2>&1'
          echo "nested parent/child probe:"
          mkdir -p "$W/.verify-artifacts/ci-all/source" 2>/dev/null || true
          echo marker > "$W/.verify-artifacts/ci-all/source/.probe" 2>/dev/null || true
          docker run --rm --pull never -v "$W/.verify-artifacts/ci-all/source:/src" -v "$W/.verify-artifacts/ci-all:/ci" alpine:3.20 sh -c 'ls -la /src 2>&1 | head -4; cat /src/.probe 2>&1'
      - name: Reproduce the controller git call
        run: |
          W=/Users/mingo/actions-runner-streamgate/_work/streamgate/streamgate
          A=$W/.verify-artifacts/ci-all
          S=$A/source
          echo "controller-start.err:"
          cat "$W/.verify-artifacts/ci-all/controller-start.err" 2>&1 || echo "(absent)"
          echo "host git status in the frozen clone:"
          cd "$S" && git status --porcelain --untracked-files=normal 2>&1 | head -6
          git rev-parse HEAD 2>&1
          echo "reproduce inside the tools image:"
          TOOLS=sg-ci-44855804275-1-tools:local
          docker run --rm --pull never -v "$S:$S" -v "$A:$A" -w "$S" $TOOLS bash -c 'echo HOME=$HOME; git config --global --add safe.directory "$PWD" 2>&1; git status --porcelain --untracked-files=normal 2>&1 | head -4; git rev-parse HEAD 2>&1'
          echo "reproduce WITHOUT the parent mount (only the source mount):"
          docker run --rm --pull never -v "$S:$S" -w "$S" $TOOLS bash -c 'git status --porcelain --untracked-files=normal 2>&1 | head -4; git rev-parse HEAD 2>&1'
      - name: Docker daemon state
        run: |
          docker info --format 'server={{.ServerVersion}} up={{.NCPU}}cpus mem={{.MemTotal}}' || true
          docker events --since 4h --until 1s --filter type=container 2>/dev/null | grep -iE "die|kill|oom|start: sg-ci-$RUN" | tail -20 || true
          uptime
