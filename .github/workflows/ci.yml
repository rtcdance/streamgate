name: Self-hosted runner acquisition probe (diagnostic only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-acquisition-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Diagnostic only - no acceptance gates
    runs-on: streamgate-acceptance
    timeout-minutes: 2
    steps:
      - name: Report self-hosted execution without checkout or Docker
        shell: bash
        run: |
          set -euo pipefail
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          uname -s
          printf 'CODEX_SELFHOSTED_PROBE_OK sha=%s\n' "$GITHUB_SHA"
