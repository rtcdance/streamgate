name: Scoped over-collected diagnostic version cleanup

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: codex-scoped-diagnostic-containment
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete only the identified unsafe diagnostic version
    runs-on: streamgate-acceptance
    timeout-minutes: 4
    steps:
      - name: Match package digest and tag, delete one version, and verify
        env:
          GH_PACKAGE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, urllib.error, urllib.parse, urllib.request
          owner = 'rtcdance'
          package = 'streamgate/evidence-real'
          digest = 'sha256:68feaa4a0e3a852022f471c03dd1f7489726ae4b16bf9c2e3107ff464728367d'
          tag = 'gate-40136111416'
          base = '/users/' + owner + '/packages/container/' + urllib.parse.quote(package, safe='')
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_PACKAGE_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def request(path, method='GET'):
              req = urllib.request.Request('https://api.github.com' + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()
                      return response.status, json.loads(data) if data else None
              except urllib.error.HTTPError as error:
                  print('SCOPED_CLEANUP_HTTP_ERROR ' + json.dumps({'method': method, 'path': path, 'status': error.code}))
                  raise SystemExit(1)
          def versions():
              result = []
              for page in range(1, 11):
                  _, rows = request(base + '/versions?per_page=100&page=' + str(page))
                  result.extend(rows)
                  if len(rows) < 100:
                      return result
              raise SystemExit('bounded version listing exceeded; no deletion performed')
          _, info = request(base)
          assert info['name'] == package, 'unexpected package name'
          assert info['owner']['login'].lower() == owner, 'unexpected package owner'
          assert info['package_type'] == 'container', 'unexpected package type'
          before = versions()
          matches = [item for item in before if item.get('name') == digest and tag in item.get('metadata', {}).get('container', {}).get('tags', [])]
          if len(matches) != 1:
              print('SCOPED_CLEANUP_NO_UNIQUE_MATCH ' + json.dumps({'matches': len(matches), 'expectedDigest': digest, 'expectedTag': tag}))
              raise SystemExit(1)
          version = matches[0]
          receipt = {
              'package': package, 'versionID': version['id'], 'digest': digest,
              'tag': tag, 'visibilityBefore': info['visibility'],
              'scope': 'one diagnostic version with over-collected files; no application or Actions artifacts deleted',
          }
          print('SCOPED_CLEANUP_SELECTED ' + json.dumps(receipt, sort_keys=True))
          status, _ = request(base + '/versions/' + str(version['id']), 'DELETE')
          assert status == 204, 'unexpected delete response'
          receipt['deleteHTTPStatus'] = status
          after = versions()
          assert all(item['id'] != version['id'] for item in after), 'deleted version is still listed'
          receipt['verifiedAbsentFromVersionList'] = True
          receipt['otherVersionIDsPreserved'] = sorted(item['id'] for item in before if item['id'] != version['id'])
          print('SCOPED_DIAGNOSTIC_VERSION_CLEANUP_OK ' + json.dumps(receipt, sort_keys=True))
          PYTHON
