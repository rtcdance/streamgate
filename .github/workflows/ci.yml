name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The reusable candidate workflow needs `packages: write` to retain the
# scanned candidate in GHCR (non-PR runs only). Fork PR tokens stay read-only
# regardless — PRs never push, they scan the same artifact bytes. `actions: read`
# lets the same-SHA test-suite gate poll test.yml's status for this commit.
permissions:
  contents: read
  packages: write
  actions: read

env:
  GO_VERSION: "1.26"
  GOPROXY: "https://proxy.golang.org,direct"
  GONOSUMDB: "gonum.org/*"
  GONOSUMCHECK: "gonum.org/*"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: streamgate
          POSTGRES_PASSWORD: streamgate
          POSTGRES_DB: streamgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # The ABI-sync guard tests (pkg/web3/contract/abi_sync_test.go) compare
      # Go-side ABIs against the Forge build artifacts in contracts/out, so this
      # job needs the contract submodules plus a forge build before go test.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Build contracts (ABI-sync guard needs the artifacts)
        working-directory: contracts
        run: forge build

      - run: go mod download

      - name: Clear Go build cache
        run: go clean -cache

      - name: Setup database schema
        env:
          PGPASSWORD: streamgate
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          # Apply every up-migration in filename order and stop at the first
          # error (ON_ERROR_STOP=1). The previous `|| true` swallowed bad SQL,
          # so a broken migration could never fail this job.
          for f in $(ls migrations/*.sql | grep -v '\.down\.sql$' | sort); do
            echo "Applying $f..."
            psql -v ON_ERROR_STOP=1 -h localhost -U streamgate -d streamgate_test < "$f"
          done

      - name: Run tests
        run: |
          # Package set is shared with `make test-ci` (scripts/ci-packages.sh)
          # so the local and CI coverage gates cannot drift apart.
          go test -race -coverprofile=coverage.out $(./scripts/ci-packages.sh)
        env:
          STREAMGATE_DB_HOST: localhost
          STREAMGATE_DB_PORT: 5432
          STREAMGATE_DB_USER: streamgate
          STREAMGATE_DB_PASSWORD: streamgate
          STREAMGATE_DB_NAME: streamgate_test
          STREAMGATE_REDIS_HOST: localhost
          STREAMGATE_REDIS_PORT: 6379

      - name: Verify the coverage gate can fail
        run: bash scripts/check-coverage_test.sh

      - name: Check coverage
        run: |
          # Human-readable summary only — never the gate itself.
          {
            echo "## Coverage Report"
            echo ""
            echo '```'
            go tool cover -func=coverage.out 2>/dev/null | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          # The gate, shared with `make test-ci`: integer maths over the
          # profile's own statement counts, and a hard failure on a
          # missing/empty/malformed profile (previously: "No coverage data
          # generated" + exit 0, i.e. no coverage could not fail the job).
          ./scripts/check-coverage.sh coverage.out 60

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  test-contracts:
    name: Solidity Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Forge dependencies
        run: forge install
        continue-on-error: true

      - name: Run Forge tests
        run: forge test -vvv

      - name: Gas report
        run: forge test --gas-report
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go mod download

      - name: Verify go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum is not tidy" && exit 1)

      - name: Build all binaries
        run: make build-all VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "ci-$(git rev-parse --short HEAD)")

      - name: Check binary sizes
        run: |
          echo "=== Binary Sizes ==="
          ls -lh bin/ 2>/dev/null || echo "No bin/ directory found"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gosec
        run: GOPROXY=${{ env.GOPROXY }} go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0

      - name: Run gosec
        run: |
          gosec -exclude-dir=examples -exclude-dir=test -exclude-dir=pkg/api -exclude=G101,G103,G104,G115,G201,G202,G203,G204,G301,G304,G306 ./...

      - name: Install govulncheck
        run: GOPROXY=${{ env.GOPROXY }} go install golang.org/x/vuln/cmd/govulncheck@latest

      # REPORTING mode for now: the chainpulse-aligned dependency set (and the
      # Go stdlib) currently carries known findings, so a hard gate would pin
      # CI red. Flip to blocking once the vuln debt is paid (dependency bump
      # is a separate, deliberate task — see TRANSITION_PLAN.md B6).
      - name: Run govulncheck (report)
        run: |
          govulncheck ./... | tee govulncheck.txt || true
          {
            echo "## govulncheck report"
            echo '```'
            tail -n 40 govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
        continue-on-error: true

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          # incorrect-equality + timestamp flag ContentRegistry's enum-sentinel
          # checks (status == Nonexistent) — intended idiom, the struct merely
          # carries timestamp fields. Reviewed and accepted (2026-10-11).
          slither-args: --filter-paths "lib|test" --exclude incorrect-equality,timestamp

  test-anvil:
    name: Anvil Integration (Web3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts (Forge artifacts the Anvil suite loads)
        working-directory: contracts
        run: |
          forge install || true
          forge build

      - name: Run Anvil integration tests
        run: go test -tags=anvil -race -count=1 ./test/integration/web3/...

  # SG-08: the comprehensive matrix gates the SAME SHA through a reusable
  # workflow_call inside this DAG, instead of running as an independent
  # workflow that merely triggers in parallel (plan §7 rule: independent
  # workflows must gate via workflow_call or SHA status checks, not just
  # parallel triggers). test.yml keeps schedule/workflow_dispatch for
  # standalone runs.
  test-suite:
    name: Comprehensive Test Suite (same SHA)
    uses: ./.github/workflows/test.yml

  # SG-08: the ONE place candidate images are built for this SHA. The reusable
  # workflow builds each image exactly once (docker-archive artifact with an
  # OCI revision label), every scan job loads THAT artifact and verifies the
  # image ID against the recorded one — scanning never rebuilds. PRs never
  # push to the registry but scan the exact bytes they would deploy.
  #
  # `candidate` succeeds only when every source gate above AND every
  # same-digest Trivy/SBOM scan inside it have passed; a failed gate skips it,
  # which skips everything downstream (fail-closed, no if:always()).
  candidate:
    name: Candidate Images (build once per SHA + same-digest scan)
    uses: ./.github/workflows/build.yml
    needs: [lint, test-go, test-contracts, test-anvil, build, security]

  docker:
    name: Candidate Smoke (same artifact)
    runs-on: ubuntu-latest
    # Smoke THE candidate built once for this SHA — no rebuild for smoke.
    needs: [candidate]
    steps:
      - name: Download the candidate image built for this SHA
        uses: actions/download-artifact@v4
        with:
          name: candidate-monolith

      - name: Load candidate and verify its identity
        run: |
          set -euo pipefail
          docker load -i candidate-monolith.tar
          actual="$(docker inspect --format '{{.Id}}' streamgate-monolith:candidate)"
          expected="$(python3 -c "import json;print(json.load(open('meta/monolith.json'))['image_id'])")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::loaded image ID $actual does not match the built candidate $expected"
            exit 1
          fi
          rev="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' streamgate-monolith:candidate)"
          if [ "$rev" != "${{ github.sha }}" ]; then
            echo "::error::OCI revision label '$rev' does not match ${{ github.sha }}"
            exit 1
          fi
          docker tag streamgate-monolith:candidate streamgate-monolith:ci
          echo "smoke-testing candidate ${actual} (revision ${rev})"

      - name: Smoke test monolith (real readiness, not "file exists")
        run: |
          set -euo pipefail
          net=ci-smoke-net
          docker network create "$net"

          cleanup() {
            docker rm -f ci-monolith ci-postgres ci-redis ci-minio ci-nats >/dev/null 2>&1 || true
            docker network rm "$net" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Minimal dependency set, addressed by container name on a private
          # network — the same wiring the fullchain stack uses. The monolith
          # cannot serve without these, so the smoke must bring them up; a bare
          # container is not a readiness test.
          docker run -d --name ci-postgres --network "$net" \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=streamgate \
            postgres:15-alpine
          docker run -d --name ci-redis --network "$net" redis:7-alpine
          docker run -d --name ci-minio --network "$net" \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          docker run -d --name ci-nats --network "$net" nats:2.10-alpine -js

          wait_for() {  # wait_for <label> <cmd...>
            local label="$1"; shift
            for _ in $(seq 1 60); do
              if "$@" >/dev/null 2>&1; then echo "$label ready"; return 0; fi
              sleep 1
            done
            echo "::error::$label did not become ready"
            return 1
          }
          wait_for postgres docker exec ci-postgres pg_isready -U postgres
          wait_for redis docker exec ci-redis redis-cli ping
          wait_for minio docker exec ci-minio curl -fsS http://localhost:9000/minio/health/live

          # The candidate under test, pointed at those dependencies.
          docker run -d --name ci-monolith --network "$net" -p 18080:8080 \
            -e APP_DEBUG=true \
            -e STREAMGATE_JWT_SECRET=ci-smoke-jwt-secret-0123456789-abcdef \
            -e STREAMGATE_DB_HOST=ci-postgres -e STREAMGATE_DB_PORT=5432 \
            -e STREAMGATE_DB_USER=postgres -e STREAMGATE_DB_PASSWORD=postgres \
            -e STREAMGATE_DB_NAME=streamgate -e STREAMGATE_DB_SSLMODE=disable \
            -e STREAMGATE_REDIS_HOST=ci-redis -e STREAMGATE_REDIS_PORT=6379 \
            -e STREAMGATE_STORAGE_TYPE=minio -e STREAMGATE_STORAGE_ENDPOINT=ci-minio:9000 \
            -e STREAMGATE_STORAGE_ACCESS_KEY=minioadmin -e STREAMGATE_STORAGE_SECRET_KEY=minioadmin \
            -e STREAMGATE_STORAGE_BUCKET=streamgate \
            -e STREAMGATE_NATS_URL=nats://ci-nats:4222 \
            streamgate-monolith:ci

          # Wait for the image's own HEALTHCHECK (wget /health) to report
          # healthy. A container that starts but never serves must fail here.
          healthy=false
          for i in $(seq 1 60); do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' ci-monolith 2>/dev/null || echo missing)"
            case "$health" in
              healthy)
                echo "monolith healthcheck: healthy after ${i}s"
                healthy=true
                break
                ;;
              unhealthy)
                echo "::error::monolith healthcheck reported unhealthy"
                docker logs ci-monolith || true
                exit 1
                ;;
            esac
            if [ "$(docker inspect -f '{{.State.Running}}' ci-monolith 2>/dev/null || echo false)" != "true" ]; then
              echo "::error::monolith exited before becoming healthy"
              docker logs ci-monolith || true
              exit 1
            fi
            sleep 1
          done
          if [ "$healthy" != "true" ]; then
            echo "::error::monolith did not become healthy within 60s"
            docker logs ci-monolith || true
            exit 1
          fi

          # Minimal business request against the real service.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/health)"
          echo "GET /health -> $code"
          [ "$code" = "200" ] || { echo "::error::/health returned $code"; docker logs ci-monolith || true; exit 1; }

  # ---------------------------------------------------------------------------
  # SG-08 post-candidate gates: durability / ops / perf run against the same
  # SHA (and, where it matters, the same candidate) and are REQUIRED jobs that
  # can fail. None of them carries if:always() or continue-on-error.
  # ---------------------------------------------------------------------------

  durability:
    name: Durability Gates (DB-backed task/outbox/event/registry)
    runs-on: ubuntu-latest
    needs: [candidate]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: streamgate
          POSTGRES_PASSWORD: streamgate
          POSTGRES_DB: streamgate_durability
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go mod download

      # These packages' acceptance suites are gated on STREAMGATE_TEST_DB_DSN
      # (they would otherwise SKIP, and a skipped required test must fail the
      # gate — see the assertion script below). With the DSN set they run
      # against the service container: lease/expiry SQL, outbox atomicity,
      # event store/checkpoints/journal, registry idempotency/nonce/reorg.
      # The required list is explicit so a package-wide zero-match run, or a
      # skip of any of these specific tests, fails instead of going green.
      - name: Run DB-backed durability suites
        env:
          STREAMGATE_TEST_DB_DSN: postgres://streamgate:streamgate@localhost:5432/streamgate_durability?sslmode=disable
        run: |
          set -euo pipefail
          go test -race -count=1 -json \
            ./pkg/service/transcoding ./pkg/web3/event ./pkg/service/registry ./pkg/service \
            > durability-tests.json || true
          python3 scripts/cd/assert_required_tests.py \
            --require 'TestIntegration_TranscodingLeaseAgainstPostgres' \
            --require 'TestAcceptance_Event' \
            --require 'TestAcceptance_RegistryIdempotency|TestAcceptance_NonceAcrossInstances|TestAcceptance_BroadcastUnknownRecovery|TestAcceptance_TxReceiptReorg' \
            --require 'TestAcceptance_ChainNonceFloor|TestAcceptance_SharedNonceAuthority' \
            --require 'TestAcceptance_TranscodeRedeliveryAndCrash|TestAcceptance_RetryAndDLQRecovery|TestAcceptance_HeartbeatRenewal' \
            durability-tests.json

      - name: Upload durability test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: durability-tests-${{ github.sha }}
          path: durability-tests.json
          retention-days: 7

  ops:
    name: Ops Gates (production profile, drain, shutdown)
    runs-on: ubuntu-latest
    needs: [candidate]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go mod download

      # Profile/ops semantics: production must fail fast instead of degrading
      # to in-memory fallbacks, the capability-window policy must hold, and
      # drain/shutdown must behave. Filters keep the gate focused on tests
      # that define ops behaviour; every one of them must actually run.
      - name: Run ops/profile/drain gates
        run: |
          set -euo pipefail
          go test -race -count=1 -json \
            -run 'TestBuildProviders_Production|TestBuildProviders_DevStillFallsBackToMemory|TestSetupRouter_Production|TestSetDraining|TestIsDraining|TestDrainMiddleware' \
            ./pkg/gateway ./pkg/core \
            > ops-gateway-core.json || true
          python3 scripts/cd/assert_required_tests.py \
            --require 'TestBuildProviders_Production|TestBuildProviders_DevStillFallsBackToMemory|TestSetupRouter_Production' \
            --require 'TestSetDraining|TestIsDraining|TestDrainMiddleware' \
            ops-gateway-core.json

          go test -race -count=1 -json \
            -run 'TestValidateProduction|TestIsProduction|TestCapabilityPolicy' \
            ./pkg/core/config \
            > ops-config.json || true
          python3 scripts/cd/assert_required_tests.py \
            --require 'TestValidateProduction|TestIsProduction' \
            --require 'TestCapabilityPolicy' \
            ops-config.json

      - name: Upload ops test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ops-tests-${{ github.sha }}
          path: ops-*.json
          retention-days: 7

  perf:
    name: Perf Harness Gates (load harness + metrics overhead)
    runs-on: ubuntu-latest
    needs: [candidate]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go mod download

      # The load harness's own correctness gates: 5xx / truncated / hash-
      # mismatched responses must never count as success throughput, and the
      # percentile/JSON plumbing must round-trip. The LIVE load matrix
      # (1/10/50 viewers against a running stack) is SG-07's dispatch runner
      # (scripts/perf-acceptance.sh), not something a CI job can honestly
      # claim from an ephemeral container. The required list pins the harness
      # correctness tests plus the metrics/ratelimit overhead tests.
      - name: Run perf harness and metrics gates
        run: |
          set -euo pipefail
          go test -race -count=1 -json ./test/load ./test/performance \
            > perf-tests.json || true
          python3 scripts/cd/assert_required_tests.py \
            --require 'TestPerfHarness_' \
            --require 'TestMetricsCollection|TestRateLimitingPerformance|TestPrometheusExportPerformance' \
            perf-tests.json

      - name: Upload perf test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-tests-${{ github.sha }}
          path: perf-tests.json
          retention-days: 7

  fullchain-acceptance:
    name: Full-Chain Acceptance (candidate, real stack)
    runs-on: ubuntu-latest
    # The media gate runs against THE candidate built once for this SHA: it
    # downloads the same artifacts the scans consumed and starts them with
    # `--no-build`, so acceptance and promotion cannot drift (plan §7:
    # media/durability/ops/perf/release only start from the candidate list).
    needs: [candidate]
    timeout-minutes: 25
    env:
      # Scope the project so teardown can only ever touch this run's containers.
      COMPOSE_PROJECT_NAME: sg-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the candidate images built for this SHA
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-{monolith,transcoder,api-gateway}
          merge-multiple: true

      - name: Load candidates and verify their identity
        run: |
          set -euo pipefail
          verify() {  # verify <service>
            local svc="$1" actual expected
            docker load -i "candidate-${svc}.tar" >/dev/null
            actual="$(docker inspect --format '{{.Id}}' "streamgate-${svc}:candidate")"
            expected="$(python3 -c "import json;print(json.load(open('meta/${svc}.json'))['image_id'])")"
            [ "$actual" = "$expected" ] || { echo "::error::${svc} loaded ID $actual != built candidate $expected"; exit 1; }
            local rev
            rev="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "streamgate-${svc}:candidate")"
            [ "$rev" = "${{ github.sha }}" ] || { echo "::error::${svc} OCI revision '$rev' != ${{ github.sha }}"; exit 1; }
            echo "${svc}: ${actual} (revision ${rev})"
          }
          verify monolith
          verify transcoder
          verify api-gateway
          # Compose resolves build-only services to <project>-<service>; the
          # monolith carries an explicit image name in the compose file.
          docker tag streamgate-monolith:candidate    streamgate-fullchain:latest
          docker tag streamgate-transcoder:candidate  "${COMPOSE_PROJECT_NAME}-transcoder"
          docker tag streamgate-api-gateway:candidate "${COMPOSE_PROJECT_NAME}-api-gateway"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts (artifacts the stack deploys)
        working-directory: contracts
        run: |
          forge install || true
          forge build

      - name: Install ffmpeg (the acceptance generates its own media)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Playwright browser
        working-directory: scripts/h5-demo-acceptance
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start the stack with the CANDIDATE images (no rebuild)
        # Only the services the acceptance needs: the app, the isolated
        # transcoder worker and the gateway mode, plus their dependencies
        # (pulled in via depends_on). `--no-build` guarantees compose uses the
        # tagged candidates — it can never silently rebuild a different image.
        # The acceptance script addresses services by fixed container name
        # (sg-fc-postgres / sg-fc-redis / sg-fc-transcoder), so container_name
        # fields — not the project name — are what it finds; teardown below
        # removes only this run's containers/networks/volumes.
        run: docker compose -f docker-compose.fullchain.yml up -d --no-build monolith transcoder api-gateway

      - name: Assert the running containers are the candidate (digest check)
        run: |
          set -euo pipefail
          check() {  # check <container> <candidate-tag>
            local container="$1" tag="$2" running expected
            running="$(docker inspect --format '{{.Image}}' "$container")"
            expected="$(docker inspect --format '{{.Id}}' "$tag")"
            [ "$running" = "$expected" ] || { echo "::error::container $container runs $running, expected candidate $expected"; exit 1; }
            echo "$container runs the candidate image"
          }
          check sg-fc-monolith    streamgate-monolith:candidate
          check sg-fc-transcoder  streamgate-transcoder:candidate
          check sg-fc-api-gateway streamgate-api-gateway:candidate

      - name: Wait for the stack to be health-ready (120s budget)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          until curl -sf http://localhost:18080/health >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::base services not health-ready within 120s"
              docker compose -f docker-compose.fullchain.yml ps
              exit 1
            fi
            sleep 3
          done
          echo "base services health-ready after ${SECONDS}s"

      - name: Full-chain acceptance (signature -> gate -> transcode -> HLS -> browser)
        env:
          # Empty channel = use the bundled Chromium we just installed, not a
          # host Chrome that does not exist on the runner.
          PW_CHANNEL: ""
        run: |
          # Stage budgets live in the script: 180s transcode, 90s browser.
          bash scripts/fullchain-acceptance.sh http://localhost:18080

      - name: Full-chain acceptance against the api-gateway deployment mode
        # The same script must pass through the gateway wiring so the two
        # deployment modes cannot drift (SG-05 step 7). The gateway does not
        # host the H5 static page and this job runs no separate h5-demo
        # container, so the demo URL points at the monolith's built-in copy.
        env:
          PW_CHANNEL: ""
          H5_DEMO_URL: http://localhost:18080/demo/
        run: |
          deadline=$((SECONDS + 60))
          until curl -sf http://localhost:28080/health >/dev/null 2>&1; do
            [ "$SECONDS" -ge "$deadline" ] && { echo "::error::api-gateway not healthy"; docker logs sg-fc-api-gateway || true; exit 1; }
            sleep 3
          done
          bash scripts/fullchain-acceptance.sh http://localhost:28080

      - name: Collect redacted diagnostics on failure
        if: failure()
        run: |
          set -uo pipefail
          mkdir -p ci-artifacts
          docker compose -f docker-compose.fullchain.yml ps > ci-artifacts/compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.fullchain.yml logs --no-color --tail 500 > ci-artifacts/compose-logs.txt 2>&1 || true
          # Redact before anything leaves the runner.
          sed -i -E 's/0x[0-9a-fA-F]{64}/0xREDACTED/g'          ci-artifacts/compose-logs.txt || true
          sed -i -E 's/(Bearer )[A-Za-z0-9._-]+/\1REDACTED/g'   ci-artifacts/compose-logs.txt || true
          sed -i -E 's/(X-Amz-Signature=)[A-Za-z0-9]+/\1REDACTED/g' ci-artifacts/compose-logs.txt || true
          sed -i -E 's/([A-Za-z_]*(SECRET|TOKEN|PASSWORD)[A-Za-z_]*=)[^ "]+/\1REDACTED/g' ci-artifacts/compose-logs.txt || true
          # Playwright reports (screenshots + per-spec JSON) help far more than logs.
          cp -R scripts/h5-demo-acceptance/reports/. ci-artifacts/ 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullchain-acceptance-diagnostics
          path: ci-artifacts/
          retention-days: 7

      - name: Tear down this run's stack
        if: always()
        run: docker compose -f docker-compose.fullchain.yml down -v --remove-orphans

  manifest:
    name: Candidate Manifest (one SHA, one identity)
    runs-on: ubuntu-latest
    # The structured candidate manifest TRANSITION_PLAN.md §7 requires, so every
    # later job can name "the candidate" by immutable identity instead of by a
    # tag that could point anywhere. It depends only on the image build and it
    # FAILS when any image was built from a different SHA than this run's, so a
    # manifest that mixes builds is never published as if it described one
    # candidate. It is a promotion input, not a test: see `publishable`.
    needs: [candidate]
    steps:
      - uses: actions/checkout@v4

      - name: Collect every candidate image's identity
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          merge-multiple: true
          path: artifacts

      - name: Write the manifest
        run: |
          set -euo pipefail
          python3 scripts/cd/write_candidate_manifest.py \
            --meta-dir artifacts/meta \
            --sha "${{ github.sha }}" \
            --build-tags "nats_integration" \
            --platform "linux/amd64" \
            --environment "ci" \
            --started-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out candidate-manifest.json

      - name: Upload the manifest
        uses: actions/upload-artifact@v4
        with:
          name: candidate-manifest-${{ github.sha }}
          path: candidate-manifest.json
          retention-days: 7

  publishable:
    name: Publishable (promotion gate)
    runs-on: ubuntu-latest
    # The terminal promotion gate (SG-08 step 1): it depends on EVERY required
    # gate — source gates, candidate build + same-digest scans, smoke, the
    # same-SHA test suite, durability, ops, perf and the real media acceptance.
    # No if:always(), no continue-on-error: any failed OR skipped upstream job
    # (including a skipped `candidate` when a source gate failed) skips this
    # job, so "publishable" can only be green when the whole DAG ran green.
    # A real release remains a separate, explicitly authorized deploy.yml
    # dispatch against the retained candidate digest — this job only declares
    # the candidate promotable.
    needs: [lint, test-go, test-contracts, test-anvil, build, security,
            candidate, manifest, test-suite, docker, durability, ops, perf,
            fullchain-acceptance]
    steps:
      - name: Every required gate passed for this SHA
        run: echo "candidate is publishable (see the retain-candidate GHCR digest in the candidate workflow for the promoted artifact)"
