name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  GOPROXY: "https://proxy.golang.org,direct"
  GONOSUMDB: "gonum.org/*"
  GONOSUMCHECK: "gonum.org/*"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: streamgate
          POSTGRES_PASSWORD: streamgate
          POSTGRES_DB: streamgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go mod download

      - name: Clear Go build cache
        run: go clean -cache

      - name: Setup database schema
        env:
          PGPASSWORD: streamgate
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          # Apply every up-migration in filename order and stop at the first
          # error (ON_ERROR_STOP=1). The previous `|| true` swallowed bad SQL,
          # so a broken migration could never fail this job.
          for f in $(ls migrations/*.sql | grep -v '\.down\.sql$' | sort); do
            echo "Applying $f..."
            psql -v ON_ERROR_STOP=1 -h localhost -U streamgate -d streamgate_test < "$f"
          done

      - name: Run tests
        run: |
          # Package set is shared with `make test-ci` (scripts/ci-packages.sh)
          # so the local and CI coverage gates cannot drift apart.
          go test -race -coverprofile=coverage.out $(./scripts/ci-packages.sh)
        env:
          STREAMGATE_DB_HOST: localhost
          STREAMGATE_DB_PORT: 5432
          STREAMGATE_DB_USER: streamgate
          STREAMGATE_DB_PASSWORD: streamgate
          STREAMGATE_DB_NAME: streamgate_test
          STREAMGATE_REDIS_HOST: localhost
          STREAMGATE_REDIS_PORT: 6379

      - name: Verify the coverage gate can fail
        run: bash scripts/check-coverage_test.sh

      - name: Check coverage
        run: |
          # Human-readable summary only — never the gate itself.
          {
            echo "## Coverage Report"
            echo ""
            echo '```'
            go tool cover -func=coverage.out 2>/dev/null | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          # The gate, shared with `make test-ci`: integer maths over the
          # profile's own statement counts, and a hard failure on a
          # missing/empty/malformed profile (previously: "No coverage data
          # generated" + exit 0, i.e. no coverage could not fail the job).
          ./scripts/check-coverage.sh coverage.out 60

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  test-contracts:
    name: Solidity Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Forge dependencies
        run: forge install
        continue-on-error: true

      - name: Run Forge tests
        run: forge test -vvv

      - name: Gas report
        run: forge test --gas-report
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go mod download

      - name: Verify go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum is not tidy" && exit 1)

      - name: Build all binaries
        run: make build-all VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "ci-$(git rev-parse --short HEAD)")

      - name: Check binary sizes
        run: |
          echo "=== Binary Sizes ==="
          ls -lh bin/ 2>/dev/null || echo "No bin/ directory found"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gosec
        run: GOPROXY=${{ env.GOPROXY }} go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0

      - name: Run gosec
        run: |
          gosec -exclude-dir=examples -exclude-dir=test -exclude-dir=pkg/api -exclude=G101,G103,G104,G115,G201,G202,G203,G204,G301,G304,G306 ./...

      - name: Install govulncheck
        run: GOPROXY=${{ env.GOPROXY }} go install golang.org/x/vuln/cmd/govulncheck@latest

      # REPORTING mode for now: the chainpulse-aligned dependency set (and the
      # Go stdlib) currently carries known findings, so a hard gate would pin
      # CI red. Flip to blocking once the vuln debt is paid (dependency bump
      # is a separate, deliberate task — see TRANSITION_PLAN.md B6).
      - name: Run govulncheck (report)
        run: |
          govulncheck ./... | tee govulncheck.txt || true
          {
            echo "## govulncheck report"
            echo '```'
            tail -n 40 govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
        continue-on-error: true

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          # incorrect-equality + timestamp flag ContentRegistry's enum-sentinel
          # checks (status == Nonexistent) — intended idiom, the struct merely
          # carries timestamp fields. Reviewed and accepted (2026-10-11).
          slither-args: --filter-paths "lib|test" --exclude incorrect-equality,timestamp

  test-anvil:
    name: Anvil Integration (Web3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts (Forge artifacts the Anvil suite loads)
        working-directory: contracts
        run: |
          forge install || true
          forge build

      - name: Run Anvil integration tests
        run: go test -tags=anvil -race -count=1 ./test/integration/web3/...

  docker:
    name: Candidate Image (build once, scan this digest)
    runs-on: ubuntu-latest
    # Every upstream gate must pass before a candidate image is built. The
    # previous `if: always() && needs.build… && needs.security…` let this job
    # build an image even when the Go tests had failed.
    needs: [lint, test-go, test-contracts, test-anvil, build, security]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build monolith image
        id: build-monolith
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.monolith
          push: false
          load: true
          tags: streamgate-monolith:ci
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image built above is THE candidate: this scan consumes exactly the
      # digest that was smoke-tested, so the gate cannot drift from the build
      # (build.yml previously rebuilt a separate image to scan it, and only on
      # non-PR events — PRs were never scanned at all).
      - name: Run Trivy vulnerability scanner (same digest as smoke)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: streamgate-monolith:ci
          format: 'table'
          severity: 'CRITICAL,HIGH'
          # Blocking gate: ANY CRITICAL/HIGH fails the job, patched or not.
          # Scanner failure also fails the job (plan SG-02 step 5).
          exit-code: '1'

      - name: Generate SBOM (same digest as smoke)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: streamgate-monolith:ci
          format: 'spdx'
          output: 'sbom-monolith.spdx'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-monolith-${{ github.sha }}
          path: sbom-monolith.spdx

      - name: Smoke test monolith (real readiness, not "file exists")
        run: |
          set -euo pipefail
          net=ci-smoke-net
          docker network create "$net"

          cleanup() {
            docker rm -f ci-monolith ci-postgres ci-redis ci-minio ci-nats >/dev/null 2>&1 || true
            docker network rm "$net" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Minimal dependency set, addressed by container name on a private
          # network — the same wiring the fullchain stack uses. The monolith
          # cannot serve without these, so the smoke must bring them up; a bare
          # container is not a readiness test.
          docker run -d --name ci-postgres --network "$net" \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=streamgate \
            postgres:15-alpine
          docker run -d --name ci-redis --network "$net" redis:7-alpine
          docker run -d --name ci-minio --network "$net" \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          docker run -d --name ci-nats --network "$net" nats:2.10-alpine -js

          wait_for() {  # wait_for <label> <cmd...>
            local label="$1"; shift
            for _ in $(seq 1 60); do
              if "$@" >/dev/null 2>&1; then echo "$label ready"; return 0; fi
              sleep 1
            done
            echo "::error::$label did not become ready"
            return 1
          }
          wait_for postgres docker exec ci-postgres pg_isready -U postgres
          wait_for redis docker exec ci-redis redis-cli ping
          wait_for minio docker exec ci-minio curl -fsS http://localhost:9000/minio/health/live

          # The candidate image under test, pointed at those dependencies.
          docker run -d --name ci-monolith --network "$net" -p 18080:8080 \
            -e APP_DEBUG=true \
            -e STREAMGATE_JWT_SECRET=ci-smoke-jwt-secret-0123456789-abcdef \
            -e STREAMGATE_DB_HOST=ci-postgres -e STREAMGATE_DB_PORT=5432 \
            -e STREAMGATE_DB_USER=postgres -e STREAMGATE_DB_PASSWORD=postgres \
            -e STREAMGATE_DB_NAME=streamgate -e STREAMGATE_DB_SSLMODE=disable \
            -e STREAMGATE_REDIS_HOST=ci-redis -e STREAMGATE_REDIS_PORT=6379 \
            -e STREAMGATE_STORAGE_TYPE=minio -e STREAMGATE_STORAGE_ENDPOINT=ci-minio:9000 \
            -e STREAMGATE_STORAGE_ACCESS_KEY=minioadmin -e STREAMGATE_STORAGE_SECRET_KEY=minioadmin \
            -e STREAMGATE_STORAGE_BUCKET=streamgate \
            -e STREAMGATE_NATS_URL=nats://ci-nats:4222 \
            streamgate-monolith:ci

          # Wait for the image's own HEALTHCHECK (wget /health) to report
          # healthy. A container that starts but never serves must fail here.
          healthy=false
          for i in $(seq 1 60); do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' ci-monolith 2>/dev/null || echo missing)"
            case "$health" in
              healthy)
                echo "monolith healthcheck: healthy after ${i}s"
                healthy=true
                break
                ;;
              unhealthy)
                echo "::error::monolith healthcheck reported unhealthy"
                docker logs ci-monolith || true
                exit 1
                ;;
            esac
            if [ "$(docker inspect -f '{{.State.Running}}' ci-monolith 2>/dev/null || echo false)" != "true" ]; then
              echo "::error::monolith exited before becoming healthy"
              docker logs ci-monolith || true
              exit 1
            fi
            sleep 1
          done
          if [ "$healthy" != "true" ]; then
            echo "::error::monolith did not become healthy within 60s"
            docker logs ci-monolith || true
            exit 1
          fi

          # Minimal business request against the real service.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/health)"
          echo "GET /health -> $code"
          [ "$code" = "200" ] || { echo "::error::/health returned $code"; docker logs ci-monolith || true; exit 1; }

  fullchain-acceptance:
    name: Full-Chain Acceptance (real stack)
    runs-on: ubuntu-latest
    # Everything upstream must be green first: this job builds the whole stack
    # and takes minutes, so there is no point starting it on a known-bad tree.
    needs: [lint, test-go, test-contracts, test-anvil, build, security]
    timeout-minutes: 25
    env:
      # Scope the project so teardown can only ever touch this run's containers.
      COMPOSE_PROJECT_NAME: sg-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts (artifacts the stack deploys)
        working-directory: contracts
        run: |
          forge install || true
          forge build

      - name: Install ffmpeg (the acceptance generates its own media)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Playwright browser
        working-directory: scripts/h5-demo-acceptance
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build the linux binaries the .quick images COPY
        # The fullchain compose builds monolith/api-gateway from the .quick
        # Dockerfiles, which COPY prebuilt linux binaries instead of compiling.
        # On a clean checkout those binaries do not exist, so `up --build`
        # failed; building them here (same commands the local Makefile uses)
        # makes the job reproducible on a fresh runner.
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=amd64 go build -o deploy/docker/streamgate-linux ./cmd/monolith/streamgate
          GOOS=linux GOARCH=amd64 go build -o deploy/docker/api-gateway-linux ./cmd/microservices/api-gateway

      - name: Build and start the stack from this checkout
        # Only the services the acceptance needs: the app, the isolated
        # transcoder worker and their dependencies (pulled in via
        # depends_on). Starting every service in the compose file would build
        # all 9 microservice images from source on every run.
        # The acceptance script addresses services by fixed container name
        # (sg-fc-postgres / sg-fc-redis / sg-fc-transcoder), so container_name
        # fields — not the project name — are what it finds; teardown below
        # removes only this run's containers/networks/volumes.
        run: docker compose -f docker-compose.fullchain.yml up -d --build monolith transcoder api-gateway

      - name: Wait for the stack to be health-ready (120s budget)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          until curl -sf http://localhost:18080/health >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::base services not health-ready within 120s"
              docker compose -f docker-compose.fullchain.yml ps
              exit 1
            fi
            sleep 3
          done
          echo "base services health-ready after ${SECONDS}s"

      - name: Full-chain acceptance (signature -> gate -> transcode -> HLS -> browser)
        env:
          # Empty channel = use the bundled Chromium we just installed, not a
          # host Chrome that does not exist on the runner.
          PW_CHANNEL: ""
        run: |
          # Stage budgets live in the script: 180s transcode, 90s browser.
          bash scripts/fullchain-acceptance.sh http://localhost:18080

      - name: Full-chain acceptance against the api-gateway deployment mode
        # The same script must pass through the gateway wiring so the two
        # deployment modes cannot drift (SG-05 step 7). The gateway does not
        # host the H5 static page and this job runs no separate h5-demo
        # container, so the demo URL points at the monolith's built-in copy.
        env:
          PW_CHANNEL: ""
          H5_DEMO_URL: http://localhost:18080/demo/
        run: |
          deadline=$((SECONDS + 60))
          until curl -sf http://localhost:28080/health >/dev/null 2>&1; do
            [ "$SECONDS" -ge "$deadline" ] && { echo "::error::api-gateway not healthy"; docker logs sg-fc-api-gateway || true; exit 1; }
            sleep 3
          done
          bash scripts/fullchain-acceptance.sh http://localhost:28080

      - name: Collect redacted diagnostics on failure
        if: failure()
        run: |
          set -uo pipefail
          mkdir -p ci-artifacts
          docker compose -f docker-compose.fullchain.yml ps > ci-artifacts/compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.fullchain.yml logs --no-color --tail 500 > ci-artifacts/compose-logs.txt 2>&1 || true
          # Redact before anything leaves the runner.
          sed -i -E 's/0x[0-9a-fA-F]{64}/0xREDACTED/g'          ci-artifacts/compose-logs.txt || true
          sed -i -E 's/(Bearer )[A-Za-z0-9._-]+/\1REDACTED/g'   ci-artifacts/compose-logs.txt || true
          sed -i -E 's/(X-Amz-Signature=)[A-Za-z0-9]+/\1REDACTED/g' ci-artifacts/compose-logs.txt || true
          sed -i -E 's/([A-Za-z_]*(SECRET|TOKEN|PASSWORD)[A-Za-z_]*=)[^ "]+/\1REDACTED/g' ci-artifacts/compose-logs.txt || true
          # Playwright reports (screenshots + per-spec JSON) help far more than logs.
          cp -R scripts/h5-demo-acceptance/reports/. ci-artifacts/ 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullchain-acceptance-diagnostics
          path: ci-artifacts/
          retention-days: 7

      - name: Tear down this run's stack
        if: always()
        run: docker compose -f docker-compose.fullchain.yml down -v --remove-orphans
