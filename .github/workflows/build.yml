name: Docker Build & Push

# SG-08: same-artifact candidate pipeline.
#
# This workflow is `workflow_call`-only: ci.yml is the single entry point, so a
# candidate image is built exactly ONCE per SHA. A standalone push/PR trigger
# here would rebuild the same SHA a second time, which is what the old layout
# did (ci.yml rebuilt for smoke, this file rebuilt again for scanning).
#
# Delivery mechanism (no registry involved on PRs, which are public here):
#   * every build exports ONE docker-archive tar, uploaded as a job artifact;
#   * every scan / smoke job downloads that tar, `docker load`s it, and
#     VERIFIES the loaded image ID against the ID recorded at build time —
#     a mismatch blocks the gate;
#   * non-PR runs additionally push the SAME loaded image to GHCR under an
#     immutable per-SHA tag (`candidate-<sha>`); deploy.yml then references the
#     recorded registry digest. Promotion never rebuilds.
#
# PRs never push to the public GHCR (the repository is public), but they scan
# the exact same candidate bytes they would deploy.
#
# No top-level `permissions:` block: this workflow only ever runs through
# workflow_call, so it inherits the caller's (ci.yml grants contents:read +
# packages:write; job-level permissions below only narrow that).
on:
  workflow_call:
    outputs:
      monolith-image-id:
        description: Content-addressable image ID (sha256:...) of the monolith candidate
        value: ${{ jobs.build-monolith.outputs.image_id }}
      transcoder-image-id:
        description: Content-addressable image ID (sha256:...) of the transcoder candidate
        value: ${{ jobs.build-transcoder.outputs.image_id }}
      monolith-registry-digest:
        description: GHCR digest of the retained monolith candidate (empty on PRs)
        value: ${{ jobs.retain-candidate.outputs.monolith_digest }}
      transcoder-registry-digest:
        description: GHCR digest of the retained transcoder candidate (empty on PRs)
        value: ${{ jobs.retain-candidate.outputs.transcoder_digest }}

env:
  REGISTRY: ghcr.io

jobs:
  build-monolith:
    name: Build Monolith (once per SHA)
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.identity.outputs.image_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The ONE build of the monolith candidate for this SHA. The docker
      # exporter writes a loadable archive instead of pushing, so the same
      # bytes serve PRs (no public push) and non-PRs (retained later by the
      # retain-candidate job from this very archive).
      - name: Build candidate image (export docker-archive)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.monolith
          push: false
          platforms: linux/amd64
          outputs: type=docker,dest=candidate-monolith.tar
          tags: streamgate-monolith:candidate
          # OCI revision label pins the image to this SHA (SG-08 step 2).
          labels: |
            com.streamgate.build.tags=nats_integration
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image identity
        id: identity
        run: |
          set -euo pipefail
          docker load -i candidate-monolith.tar
          image_id="$(docker inspect --format '{{.Id}}' streamgate-monolith:candidate)"
          echo "image_id=${image_id}" >> "$GITHUB_OUTPUT"
          mkdir -p meta
          python3 scripts/cd/image_identity.py \
            --tag streamgate-monolith:candidate --archive candidate-monolith.tar \
            --revision "${{ github.sha }}" --out meta/monolith.json

      - name: Upload candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-monolith
          path: |
            candidate-monolith.tar
            meta/monolith.json
          retention-days: 30

  build-transcoder:
    name: Build Transcoder (once per SHA)
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.identity.outputs.image_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build candidate image (export docker-archive)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.transcoder
          push: false
          platforms: linux/amd64
          outputs: type=docker,dest=candidate-transcoder.tar
          tags: streamgate-transcoder:candidate
          labels: |
            com.streamgate.build.tags=nats_integration
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image identity
        id: identity
        run: |
          set -euo pipefail
          docker load -i candidate-transcoder.tar
          image_id="$(docker inspect --format '{{.Id}}' streamgate-transcoder:candidate)"
          echo "image_id=${image_id}" >> "$GITHUB_OUTPUT"
          mkdir -p meta
          python3 scripts/cd/image_identity.py \
            --tag streamgate-transcoder:candidate --archive candidate-transcoder.tar \
            --revision "${{ github.sha }}" --out meta/transcoder.json

      - name: Upload candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-transcoder
          path: |
            candidate-transcoder.tar
            meta/transcoder.json
          retention-days: 30

  build-microservices:
    name: Build ${{ matrix.service }} (once per SHA)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # transcoder is built by the dedicated build-transcoder job (it needs
        # its own output for the release drill), so it is not in this matrix.
        service: [api-gateway, auth, cache, metadata, monitor, streaming, upload, worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build candidate image (export docker-archive)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.${{ matrix.service }}
          push: false
          platforms: linux/amd64
          outputs: type=docker,dest=candidate-${{ matrix.service }}.tar
          tags: streamgate-${{ matrix.service }}:candidate
          labels: |
            com.streamgate.build.tags=nats_integration
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image identity
        run: |
          set -euo pipefail
          docker load -i candidate-${{ matrix.service }}.tar
          image_id="$(docker inspect --format '{{.Id}}' streamgate-${{ matrix.service }}:candidate)"
          mkdir -p meta
          python3 scripts/cd/image_identity.py \
            --tag streamgate-${{ matrix.service }}:candidate --archive candidate-${{ matrix.service }}.tar \
            --revision "${{ github.sha }}" --out meta/${{ matrix.service }}.json

      - name: Upload candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.service }}
          path: |
            candidate-${{ matrix.service }}.tar
            meta/${{ matrix.service }}.json
          retention-days: 30

  scan-monolith:
    name: Scan Monolith (same digest)
    runs-on: ubuntu-latest
    needs: build-monolith
    steps:
      - name: Download candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-monolith

      - name: Load candidate and verify identity
        id: load
        run: |
          set -euo pipefail
          docker load -i candidate-monolith.tar
          actual="$(docker inspect --format '{{.Id}}' streamgate-monolith:candidate)"
          expected="$(python3 -c "import json;print(json.load(open('meta/monolith.json'))['image_id'])")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::loaded monolith image ID $actual does not match the built candidate $expected"
            exit 1
          fi
          echo "Scanning candidate ${actual} (commit ${{ github.sha }})"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: streamgate-monolith:candidate
          format: 'table'
          severity: 'CRITICAL,HIGH'
          # Blocking gate: ANY CRITICAL/HIGH fails the job, patched or not.
          #
          # History: this step previously carried `options: '--ignore-unfixed'`,
          # but trivy-action@v0.36.0 has no `options` input (it warns and ignores
          # it), so that exemption never took effect — the gate has in fact always
          # blocked unfixed findings as well. The dead key is removed rather than
          # converted to the real `ignore-unfixed: true` input, because the
          # stricter behaviour is the intended one here.
          #
          # 2026-10-11: baseline raised to Go 1.26 + x/net v0.60 + grpc v1.83.2;
          # the image now scans clean — 0 findings, verified in run 38122905154.
          # If upstream ever ships an unfixable HIGH in the base image, add a
          # documented exception here instead of relaxing the whole gate.
          exit-code: '1'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: streamgate-monolith:candidate
          format: 'spdx'
          output: 'sbom-monolith.spdx'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-monolith
          path: sbom-monolith.spdx

  scan-transcoder:
    name: Scan Transcoder (same digest)
    runs-on: ubuntu-latest
    needs: build-transcoder
    steps:
      - name: Download candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-transcoder

      - name: Load candidate and verify identity
        run: |
          set -euo pipefail
          docker load -i candidate-transcoder.tar
          actual="$(docker inspect --format '{{.Id}}' streamgate-transcoder:candidate)"
          expected="$(python3 -c "import json;print(json.load(open('meta/transcoder.json'))['image_id'])")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::loaded transcoder image ID $actual does not match the built candidate $expected"
            exit 1
          fi
          echo "Scanning candidate ${actual} (commit ${{ github.sha }})"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: streamgate-transcoder:candidate
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: streamgate-transcoder:candidate
          format: 'spdx'
          output: 'sbom-transcoder.spdx'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-transcoder
          path: sbom-transcoder.spdx

  scan-microservices:
    name: Scan ${{ matrix.service }} (same digest)
    runs-on: ubuntu-latest
    needs: build-microservices
    strategy:
      fail-fast: false
      matrix:
        # transcoder is covered by the dedicated scan-transcoder job (its
        # candidate comes from build-transcoder, not this matrix).
        service: [api-gateway, auth, cache, metadata, monitor, streaming, upload, worker]
    steps:
      - name: Download candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-${{ matrix.service }}

      - name: Load candidate and verify identity
        run: |
          set -euo pipefail
          docker load -i candidate-${{ matrix.service }}.tar
          actual="$(docker inspect --format '{{.Id}}' streamgate-${{ matrix.service }}:candidate)"
          expected="$(python3 -c "import json;print(json.load(open('meta/${{ matrix.service }}.json'))['image_id'])")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::loaded ${{ matrix.service }} image ID $actual does not match the built candidate $expected"
            exit 1
          fi
          echo "Scanning candidate ${actual} (commit ${{ github.sha }})"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: streamgate-${{ matrix.service }}:candidate
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: streamgate-${{ matrix.service }}:candidate
          format: 'spdx'
          output: 'sbom-${{ matrix.service }}.spdx'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx

  retain-candidate:
    name: Retain Candidate in GHCR (same image, per-SHA tag)
    runs-on: ubuntu-latest
    # Retention only after every scan of this candidate passed: the bytes that
    # land in GHCR are the scanned bytes, and nothing unscanned is retained.
    needs: [build-monolith, build-transcoder, build-microservices,
            scan-monolith, scan-transcoder, scan-microservices]
    # PRs keep the candidate as artifacts only (the repository is public).
    # Skipped on PRs by design; downstream jobs treat an empty digest as
    # "not published" rather than as a failure. This is candidate RETENTION
    # for later deploy/release-validation, not a release: deployment still
    # requires the explicit deploy.yml dispatch + environment gate.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      monolith_digest: ${{ steps.push.outputs.monolith_digest }}
      transcoder_digest: ${{ steps.push.outputs.transcoder_digest }}
    steps:
      - name: Download all candidate artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-*
          # Every artifact uses unique filenames (candidate-<svc>.tar,
          # meta/<svc>.json), so flattening them is safe and lets push_one
          # read the paths directly.
          merge-multiple: true

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the SAME loaded images — no rebuild. The registry digest recorded
      # here is the digest every later step (deploy.yml, promotion) must use.
      - name: Push candidates under immutable per-SHA tags
        id: push
        run: |
          set -euo pipefail
          repo="${{ env.REGISTRY }}/${{ github.repository }}"
          sha="${{ github.sha }}"
          push_one() {  # push_one <local-image> <repo-suffix> <output-var>
            local local_image="$1" suffix="$2" out="$3" remote digest push_out
            docker load -i "candidate-${suffix}.tar"
            remote="${repo}/${suffix}:candidate-${sha}"
            docker tag "$local_image" "$remote"
            # The push output carries the registry digest; RepoDigests can lag
            # one pull behind, so the printed digest is the authoritative one.
            push_out="$(docker push "$remote" 2>&1)"
            printf '%s\n' "$push_out"
            digest="$(printf '%s\n' "$push_out" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | head -1)"
            if [ -z "$digest" ]; then
              echo "::error::could not determine registry digest for ${remote}"
              exit 1
            fi
            echo "${out}=${digest}" >> "$GITHUB_OUTPUT"
            echo "pushed ${remote}@${digest}"
          }
          push_one streamgate-monolith:candidate monolith monolith_digest
          push_one streamgate-transcoder:candidate transcoder transcoder_digest
          for svc in api-gateway auth cache metadata monitor streaming upload worker; do
            push_one "streamgate-${svc}:candidate" "$svc" "digest_${svc}"
          done
