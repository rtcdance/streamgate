name: Docker Build & Push

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-monolith:
    name: Build Monolith Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/monolith
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push monolith
        id: build-monolith
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.monolith
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export the pushed digest
        # The digest of what was pushed is the identity every later job must
        # consume; rebuilding an image to scan it could scan different bytes.
        run: |
          echo "${{ steps.build-monolith.outputs.digest }}" > monolith-digest.txt
          echo "pushed digest: $(cat monolith-digest.txt)"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: monolith-digest-${{ github.sha }}
          path: monolith-digest.txt

  build-microservices:
    name: Build ${{ matrix.service }} Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth, cache, metadata, monitor, streaming, transcoder, upload, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan-monolith:
    name: Scan Monolith Image (same digest as push)
    runs-on: ubuntu-latest
    needs: build-monolith
    # PRs are scanned by the CI workflow's candidate-image job, which builds
    # one image and scans that exact digest; this job covers the pushed image
    # so the promoted artifact is the scanned artifact (plan SG-02 step 5).
    if: github.event_name != 'pull_request'
    steps:
      - name: Download the pushed digest
        uses: actions/download-artifact@v4
        with:
          name: monolith-digest-${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the pushed image at its digest
        # No rebuild: the scan consumes exactly the bytes that were pushed.
        run: |
          set -euo pipefail
          DIGEST="$(cat monolith-digest.txt)"
          [ -n "$DIGEST" ] || { echo "::error::pushed digest artifact was empty"; exit 1; }
          docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/monolith@${DIGEST}"
          docker tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/monolith@${DIGEST}" streamgate-monolith:scan
          echo "scanning ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/monolith@${DIGEST}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: streamgate-monolith:scan
          format: 'table'
          severity: 'CRITICAL,HIGH'
          # Blocking gate: ANY CRITICAL/HIGH fails the job, patched or not.
          #
          # History: this step previously carried `options: '--ignore-unfixed'`,
          # but trivy-action@v0.36.0 has no `options` input (it warns and ignores
          # it), so that exemption never took effect — the gate has in fact always
          # blocked unfixed findings as well. The dead key is removed rather than
          # converted to the real `ignore-unfixed: true` input, because the
          # stricter behaviour is the intended one here.
          #
          # 2026-10-11: baseline raised to Go 1.26 + x/net v0.60 + grpc v1.83.2;
          # the image now scans clean — 0 findings, verified in run 38122905154.
          # If upstream ever ships an unfixable HIGH in the base image, add a
          # documented exception here instead of relaxing the whole gate.
          exit-code: '1'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: streamgate-monolith:scan
          format: 'spdx'
          output: 'sbom-monolith.spdx'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-monolith
          path: sbom-monolith.spdx
