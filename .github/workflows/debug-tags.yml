name: Debug Tags
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List MinIO tags on Docker Hub
        run: |
          for repo in bitnamilegacy/minio bitnami/minio minio/minio; do
            echo "=== $repo ==="
            curl -s "https://hub.docker.com/v2/repositories/$repo/tags?page_size=100" | grep -oE '"name":"[^s][^"]*"' | grep -v sha256 | head -30
            echo
          done
