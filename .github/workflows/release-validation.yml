name: Release Validation (same-artifact Docker entry)

# Manual validation and reusable calls use the same release stage as final all.
# Archives and build metadata come from one identified CI run; tags alone are
# never a deployment identity. This workflow only creates temporary projects.
on:
  workflow_call:
    inputs:
      candidate_run_id:
        type: string
        required: false
        default: ""
        description: "Source CI run; empty consumes the caller's own build artifacts."
      candidate_sha:
        type: string
        required: false
        default: ""
      image_digest:
        type: string
        required: false
        default: ""
      previous_sha:
        type: string
        required: false
        default: ""
        description: "Empty or exactly the frozen safety baseline; unqualified overrides are refused."
      image_ref:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      candidate_run_id:
        required: true
        description: "CI run ID containing the candidate build archives and manifest."
      candidate_sha:
        required: true
        description: "Full SHA of the candidate in that CI run."
      image_digest:
        required: false
        default: ""
        description: "Optional monolith registry digest pin."
      previous_sha:
        required: false
        default: ""
        description: "Empty or exactly the frozen safety baseline."
      image_ref:
        required: false
        default: ""
        description: "Optional monolith registry repository pin."

permissions:
  contents: read
  actions: read

env:
  VERIFY_PROJECT: sg-relval-${{ github.run_id }}-${{ github.run_attempt }}
  VERIFY_CANDIDATE_PREFIX: sg-relval-${{ github.run_id }}-${{ github.run_attempt }}-candidate
  VERIFY_ARTIFACTS: ${{ github.workspace }}/.verify-artifacts/relval
  VERIFY_BUILD_ARTIFACTS: ${{ github.workspace }}/.verify-artifacts/relval/build-inputs
  VERIFY_PLATFORM: linux/amd64
  VERIFY_STAGE: release
  VERIFY_MODE: candidate
  VERIFY_GOPROXY: https://proxy.golang.org,direct

jobs:
  validate:
    name: Empty-volume deploy, schema compatibility and three failure drills
    runs-on: ${{ vars.STREAMGATE_ACCEPTANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Validate candidate and source run identity
        env:
          SOURCE_RUN: ${{ inputs.candidate_run_id || github.run_id }}
          EXPECTED_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ ]]
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]
          printf 'CANDIDATE_SHA=%s\nSOURCE_RUN=%s\n' "$EXPECTED_SHA" "$SOURCE_RUN" >> "$GITHUB_ENV"

      - name: Download the identified CI build archives and metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.SOURCE_RUN }}
          pattern: candidate-*
          merge-multiple: true
          path: .verify-artifacts/relval/build-inputs

      - name: Download the CI manifest for a dispatched candidate
        if: inputs.candidate_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.SOURCE_RUN }}
          name: candidate-manifest-${{ env.CANDIDATE_SHA }}
          path: .verify-artifacts/relval/ci-manifest

      - name: Check optional registry pins and the frozen rollback target
        env:
          SOURCE_RUN_INPUT: ${{ inputs.candidate_run_id }}
          EXPECTED_DIGEST: ${{ inputs.image_digest }}
          EXPECTED_REPOSITORY: ${{ inputs.image_ref }}
          PREVIOUS_SHA: ${{ inputs.previous_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os, pathlib, re
          floor = json.loads(pathlib.Path('config/performance.acceptance.json').read_text())['safetyBaselineRevision']
          previous = os.environ['PREVIOUS_SHA']
          if previous and previous != floor:
              raise SystemExit('rollback override is not the frozen safety baseline')
          if os.environ['SOURCE_RUN_INPUT']:
              manifest = json.loads(pathlib.Path('.verify-artifacts/relval/ci-manifest/candidate-manifest.json').read_text())
              if manifest['candidateSHA'] != os.environ['CANDIDATE_SHA']:
                  raise SystemExit('source CI manifest does not match candidate SHA')
              image = manifest['images']['monolith']
              digest, repository = os.environ['EXPECTED_DIGEST'], os.environ['EXPECTED_REPOSITORY']
              if digest and (not re.fullmatch(r'sha256:[0-9a-f]{64}', digest) or image['registryDigest'] != digest):
                  raise SystemExit('monolith registry digest differs from the requested pin')
              if repository and image.get('registryReference', '').split('@')[0] != repository:
                  raise SystemExit('monolith registry repository differs from the requested pin')
          elif os.environ['EXPECTED_DIGEST'] or os.environ['EXPECTED_REPOSITORY']:
              raise SystemExit('registry pins require the identified source CI run and its verified manifest')
          PYCODE

      - name: Run the same Docker release gate as complete acceptance
        run: |
          set -euo pipefail
          mkdir -p "$VERIFY_ARTIFACTS"
          set +e
          bash scripts/verify-docker.sh 2>&1 | tee "$VERIFY_ARTIFACTS/command.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$VERIFY_ARTIFACTS/command.exit"
          [ "${statuses[0]}" = 0 ] || exit "${statuses[0]}"
          [ "${statuses[1]}" = 0 ] || exit "${statuses[1]}"

      - name: Upload temporary-deployment evidence on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .verify-artifacts/relval/
            !.verify-artifacts/relval/build-inputs/**
            !.verify-artifacts/relval/.private/**
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
