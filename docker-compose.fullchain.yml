# Full-chain dual deployment: monolith (:18000) + microservices (:18001)
# Usage: docker compose -f docker-compose.fullchain.yml up --build
# Monolith demo: http://localhost:18000/demo/
# Microservices demo: http://localhost:18001/demo/
services:
  # ---- Shared Infrastructure ----
  postgres:
    image: postgres:15-alpine
    container_name: sg-fc-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streamgate
    ports:
      - "15432:5432"
    volumes:
      - fc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sg-fc-redis
    ports:
      - "16379:6379"
    volumes:
      - fc-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # minio/minio is no longer publicly pullable from Docker Hub (pull access
    # denied); bitnamilegacy/minio is the still-published equivalent used by
    # compose.verify.yml and the CI jobs. user: root keeps the named volume
    # writable, and the image ships both curl and mc, so the healthcheck below
    # works unchanged.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    user: root
    container_name: sg-fc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - fc-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: sg-fc-nats
    command: "-js"
    ports:
      - "14222:4222"
    volumes:
      - fc-nats-data:/data
    healthcheck:
      test: ["CMD", "nats-server", "--version"]
      interval: 5s
      timeout: 3s
      retries: 5

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: sg-fc-anvil
    entrypoint: ["/contracts/docker-entrypoint.sh"]
    ports:
      - "18545:8545"
    volumes:
      - ./contracts:/contracts:ro
    cpuset: "0"
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 512M
        reservations:
          cpus: '0.30'
          memory: 256M
    # Healthy = contracts DEPLOYED, not merely "anvil answers": the entrypoint
    # cold-compiles before forge create (minutes on a pinned core), and the app
    # signs with the same deployer key — starting it mid-compile spends the
    # CREATE nonces, so DemoNFT lands off-address and every mint/gate then
    # fails (observed: DemoNFT at 0x9fE467... instead of 0x5FbDB2...).
    # The generous failure budget only delays the unhealthy verdict; a passing
    # check marks healthy within one interval.
    healthcheck:
      test: ["CMD-SHELL", "cast code --rpc-url http://localhost:8545 0x5FbDB2315678afecb367f032d93F642f64180aa3 | grep -qE '^0x[0-9a-fA-F]{20,}' && cast code --rpc-url http://localhost:8545 0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512 | grep -qE '^0x[0-9a-fA-F]{20,}'"]
      interval: 10s
      timeout: 5s
      start_period: 600s
      retries: 30

  consul:
    image: hashicorp/consul:latest
    container_name: sg-fc-consul
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    ports:
      - "28500:8500"
    volumes:
      - fc-consul-data:/consul/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Monolith ----
  monolith:
    image: streamgate-fullchain:latest
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.monolith.quick
    container_name: sg-fc-monolith
    ports:
      - "18080:8080"
      - "19090:9090"
    environment:
      - APP_DEBUG=true
      - STREAMGATE_DB_HOST=postgres
      - STREAMGATE_DB_PORT=5432
      - STREAMGATE_DB_USER=postgres
      - STREAMGATE_DB_PASSWORD=postgres
      - STREAMGATE_DB_NAME=streamgate
      - STREAMGATE_DB_SSLMODE=disable
      - STREAMGATE_REDIS_HOST=redis
      - STREAMGATE_REDIS_PORT=6379
      - STREAMGATE_STORAGE_TYPE=minio
      - STREAMGATE_STORAGE_ENDPOINT=minio:9000
      - STREAMGATE_STORAGE_ACCESS_KEY=minioadmin
      - STREAMGATE_STORAGE_SECRET_KEY=minioadmin
      - STREAMGATE_STORAGE_BUCKET=streamgate
      - STREAMGATE_NATS_URL=nats://nats:4222
      - STREAMGATE_JWT_SECRET=fullchain-acceptance-secret-2026
      # Durable profile (SG-12 step 5): the monolith SUBMITS transcode tasks
      # (Postgres + outbox + JetStream) but the isolated sg-fc-transcoder
      # worker executes them — untrusted media parsing stays out of the
      # JWT-signing process.
      - STREAMGATE_TRANSCODING_ENABLED=false
      - STREAMGATE_CORS_ORIGINS=http://localhost:18000,http://localhost:18001,http://localhost:3000,http://localhost:8080,http://localhost:18080
      - STREAMGATE_ETH_RPC=http://anvil:8545
      - WEB3_CHAIN_ID=31337
      - STREAMGATE_ANVIL_DEPLOYER_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - STREAMGATE_CONTENT_REGISTRY_ADDRESS=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
      anvil:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # ---- Microservices ----
  api-gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api-gateway.quick
    container_name: sg-fc-api-gateway
    ports:
      - "28080:8080"
    environment:
      - APP_DEBUG=true
      - STREAMGATE_JWT_SECRET=fullchain-acceptance-secret-2026
      - STREAMGATE_DB_HOST=postgres
      - STREAMGATE_DB_PORT=5432
      - STREAMGATE_DB_USER=postgres
      - STREAMGATE_DB_PASSWORD=postgres
      - STREAMGATE_DB_NAME=streamgate
      - STREAMGATE_REDIS_HOST=redis
      - STREAMGATE_REDIS_PORT=6379
      - STREAMGATE_STORAGE_ENDPOINT=minio:9000
      - STREAMGATE_STORAGE_ACCESS_KEY=minioadmin
      - STREAMGATE_STORAGE_SECRET_KEY=minioadmin
      - STREAMGATE_STORAGE_BUCKET=streamgate
      - STREAMGATE_NATS_URL=nats://nats:4222
      - STREAMGATE_CONSUL_HOST=consul
      - STREAMGATE_CONSUL_PORT=8500
      # Submitter only: the isolated sg-fc-transcoder worker executes tasks
      # (SG-12 step 5), so this process must not run an embedded worker.
      - STREAMGATE_TRANSCODING_ENABLED=false
      - STREAMGATE_ETH_RPC=http://anvil:8545
      - WEB3_CHAIN_ID=31337
      - STREAMGATE_ANVIL_DEPLOYER_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - STREAMGATE_CONTENT_REGISTRY_ADDRESS=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
      - STREAMGATE_CORS_ORIGINS=http://localhost:18000,http://localhost:18001,http://localhost:28080,http://localhost:3000,http://localhost:8080
    depends_on:
      anvil:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.auth
    container_name: sg-fc-auth
    environment:
      - APP_DEBUG=true
      - STREAMGATE_JWT_SECRET=fullchain-acceptance-secret-2026
      - STREAMGATE_DB_HOST=postgres
      - STREAMGATE_DB_PORT=5432
      - STREAMGATE_DB_USER=postgres
      - STREAMGATE_DB_PASSWORD=postgres
      - STREAMGATE_DB_NAME=streamgate
      - STREAMGATE_REDIS_HOST=redis
      - STREAMGATE_REDIS_PORT=6379
      - STREAMGATE_NATS_URL=nats://nats:4222
      - STREAMGATE_CONSUL_HOST=consul
      - STREAMGATE_CONSUL_PORT=8500
      - STREAMGATE_ETH_RPC=http://anvil:8545
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Isolated media worker (SG-12 step 5): consumes Postgres/JetStream tasks the
  # app processes submit and runs FFmpeg here, OUTSIDE the wallet/JWT-signing
  # trust domain. Deliberately has NO JWT secret, NO chain RPC, NO anvil key.
  transcoder:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.transcoder
    container_name: sg-fc-transcoder
    environment:
      - APP_DEBUG=true
      - STREAMGATE_DB_HOST=postgres
      - STREAMGATE_DB_PORT=5432
      - STREAMGATE_DB_USER=postgres
      - STREAMGATE_DB_PASSWORD=postgres
      - STREAMGATE_DB_NAME=streamgate
      - STREAMGATE_DB_SSLMODE=disable
      - STREAMGATE_STORAGE_ENDPOINT=minio:9000
      - STREAMGATE_STORAGE_ACCESS_KEY=minioadmin
      - STREAMGATE_STORAGE_SECRET_KEY=minioadmin
      - STREAMGATE_STORAGE_BUCKET=streamgate
      - STREAMGATE_NATS_URL=nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Untrusted media parsing runs here, so the container is fenced in: no
    # capabilities, read-only rootfs (FFmpeg works in the tmpfs /tmp), and
    # bounded CPU/memory so one job cannot starve the stack.
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped

  upload:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.upload
    container_name: sg-fc-upload
    environment:
      - APP_DEBUG=true
      - STREAMGATE_JWT_SECRET=fullchain-acceptance-secret-2026
      - STREAMGATE_DB_HOST=postgres
      - STREAMGATE_DB_PORT=5432
      - STREAMGATE_DB_USER=postgres
      - STREAMGATE_DB_PASSWORD=postgres
      - STREAMGATE_DB_NAME=streamgate
      - STREAMGATE_REDIS_HOST=redis
      - STREAMGATE_REDIS_PORT=6379
      - STREAMGATE_STORAGE_ENDPOINT=minio:9000
      - STREAMGATE_STORAGE_ACCESS_KEY=minioadmin
      - STREAMGATE_STORAGE_SECRET_KEY=minioadmin
      - STREAMGATE_STORAGE_BUCKET=streamgate
      - STREAMGATE_NATS_URL=nats://nats:4222
      - STREAMGATE_CONSUL_HOST=consul
      - STREAMGATE_CONSUL_PORT=8500
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  streaming:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.streaming
    container_name: sg-fc-streaming
    environment:
      - APP_DEBUG=true
      - STREAMGATE_JWT_SECRET=fullchain-acceptance-secret-2026
      - STREAMGATE_DB_HOST=postgres
      - STREAMGATE_DB_PORT=5432
      - STREAMGATE_DB_USER=postgres
      - STREAMGATE_DB_PASSWORD=postgres
      - STREAMGATE_DB_NAME=streamgate
      - STREAMGATE_REDIS_HOST=redis
      - STREAMGATE_REDIS_PORT=6379
      - STREAMGATE_STORAGE_ENDPOINT=minio:9000
      - STREAMGATE_STORAGE_ACCESS_KEY=minioadmin
      - STREAMGATE_STORAGE_SECRET_KEY=minioadmin
      - STREAMGATE_STORAGE_BUCKET=streamgate
      - STREAMGATE_NATS_URL=nats://nats:4222
      - STREAMGATE_CONSUL_HOST=consul
      - STREAMGATE_CONSUL_PORT=8500
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  metadata:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.metadata
    container_name: sg-fc-metadata
    environment:
      - APP_DEBUG=true
      - STREAMGATE_JWT_SECRET=fullchain-acceptance-secret-2026
      - STREAMGATE_DB_HOST=postgres
      - STREAMGATE_DB_PORT=5432
      - STREAMGATE_DB_USER=postgres
      - STREAMGATE_DB_PASSWORD=postgres
      - STREAMGATE_DB_NAME=streamgate
      - STREAMGATE_REDIS_HOST=redis
      - STREAMGATE_REDIS_PORT=6379
      - STREAMGATE_NATS_URL=nats://nats:4222
      - STREAMGATE_CONSUL_HOST=consul
      - STREAMGATE_CONSUL_PORT=8500
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  cache:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.cache
    container_name: sg-fc-cache
    environment:
      - APP_DEBUG=true
      - STREAMGATE_JWT_SECRET=fullchain-acceptance-secret-2026
      - STREAMGATE_REDIS_HOST=redis
      - STREAMGATE_REDIS_PORT=6379
      - STREAMGATE_DB_HOST=postgres
      - STREAMGATE_DB_PORT=5432
      - STREAMGATE_DB_USER=postgres
      - STREAMGATE_DB_PASSWORD=postgres
      - STREAMGATE_DB_NAME=streamgate
      - STREAMGATE_NATS_URL=nats://nats:4222
      - STREAMGATE_CONSUL_HOST=consul
      - STREAMGATE_CONSUL_PORT=8500
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    container_name: sg-fc-worker
    environment:
      - APP_DEBUG=true
      - STREAMGATE_JWT_SECRET=fullchain-acceptance-secret-2026
      - STREAMGATE_DB_HOST=postgres
      - STREAMGATE_DB_PORT=5432
      - STREAMGATE_DB_USER=postgres
      - STREAMGATE_DB_PASSWORD=postgres
      - STREAMGATE_DB_NAME=streamgate
      - STREAMGATE_REDIS_HOST=redis
      - STREAMGATE_REDIS_PORT=6379
      - STREAMGATE_STORAGE_ENDPOINT=minio:9000
      - STREAMGATE_STORAGE_ACCESS_KEY=minioadmin
      - STREAMGATE_STORAGE_SECRET_KEY=minioadmin
      - STREAMGATE_STORAGE_BUCKET=streamgate
      - STREAMGATE_NATS_URL=nats://nats:4222
      - STREAMGATE_CONSUL_HOST=consul
      - STREAMGATE_CONSUL_PORT=8500
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.monitor
    container_name: sg-fc-monitor
    environment:
      - APP_DEBUG=true
      - STREAMGATE_JWT_SECRET=fullchain-acceptance-secret-2026
      - STREAMGATE_REDIS_HOST=redis
      - STREAMGATE_REDIS_PORT=6379
      - STREAMGATE_DB_HOST=postgres
      - STREAMGATE_DB_PORT=5432
      - STREAMGATE_DB_USER=postgres
      - STREAMGATE_DB_PASSWORD=postgres
      - STREAMGATE_DB_NAME=streamgate
      - STREAMGATE_NATS_URL=nats://nats:4222
      - STREAMGATE_CONSUL_HOST=consul
      - STREAMGATE_CONSUL_PORT=8500
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ---- H5 Demo (dual port) ----
  h5-demo:
    image: nginx:alpine
    container_name: sg-fc-h5-demo
    ports:
      - "18000:8080"
      - "18001:8081"
    volumes:
      - ./h5-demo:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # deploy/nginx/default.conf proxies to host.docker.internal:18080/:28080.
    # Docker Desktop defines that name for every container, Linux engines do
    # not — without it nginx exits at startup ("host not found in upstream"),
    # which is exactly the CI runner's environment.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      monolith:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fc-postgres-data:
  fc-redis-data:
  fc-minio-data:
  fc-nats-data:
  fc-consul-data:
